name: Delivery validation

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '17 0 * * 1' # Monday 00:17 UTC
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag: vMAJOR.MINOR.PATCH[-PRERELEASE], matching module major; no build metadata'
        required: false
        type: string

permissions:
  contents: read

# Serialize retries for a tag without cancelling a publication in progress.
concurrency:
  group: delivery-${{ github.ref_type == 'tag' && github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  release-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Validate release tag (no publication)
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            go run ./tools/releasecheck -tag "$RELEASE_TAG"
          fi

  native:
    needs: release-tag
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then printf '%s\n' "$files"; exit 1; fi
      - run: go mod tidy -diff
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o "${RUNNER_TEMP}/server" ./cmd/server

  generated-consumer:
    needs: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: go run ./tools/templatecheck

  container:
    needs: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: go run ./tools/containercheck

  vulnerabilities:
    needs: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  codeql:
    name: CodeQL (${{ matrix.language }})
    # Private/internal consumers must enable licensed Code Security before opting in.
    # Dependabot PR uploads are supported; its push tokens (including squash authors) are read-only.
    if: >-
      (github.event.repository.visibility == 'public' || vars.ENABLE_CODEQL == 'true') &&
      (github.event_name != 'push' ||
        (github.actor != 'dependabot[bot]' &&
          github.event.head_commit.author.username != 'dependabot[bot]' &&
          github.event.head_commit.author.name != 'dependabot[bot]'))
    needs: release-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go does not support build-mode: none; use an explicit Go build.
          - language: go
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: '1.27.3'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build Go for CodeQL
        if: matrix.language == 'go'
        run: go build ./...
      - name: Analyze and upload CodeQL results
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [release-tag, native, generated-consumer, container, vulnerabilities, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CANDIDATE_COMMIT: ${{ github.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
      - name: Verify remote tag still matches the event commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          remote_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$remote_commit" != "$CANDIDATE_COMMIT" ]]; then
            echo "::error::Tag $RELEASE_TAG no longer points to event commit $CANDIDATE_COMMIT (found $remote_commit); keep tags immutable and publish a new version."
            exit 1
          fi
      # Run even if this tag already has a release: retries must revalidate it.
      - name: Validate exact public module and generated consumer
        run: go run ./tools/publiccheck -version "$RELEASE_TAG" -commit "$CANDIDATE_COMMIT"
      - name: Create release or preserve an existing publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Recheck after public consumer tests, before any release API operation.
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          remote_commit="$(git rev-parse 'FETCH_HEAD^{commit}')"
          if [[ "$remote_commit" != "$CANDIDATE_COMMIT" ]]; then
            echo "::error::Tag $RELEASE_TAG no longer points to event commit $CANDIDATE_COMMIT (found $remote_commit); keep tags immutable and publish a new version."
            exit 1
          fi
          # List with authentication so drafts are visible. API errors must fail,
          # never be mistaken for an absent release.
          existing="$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" |
            jq -s --arg tag "$RELEASE_TAG" '[.[][] | select(.tag_name == $tag)]')"
          if jq -e 'length > 0' <<< "$existing" > /dev/null; then
            if jq -e 'any(.[]; .draft)' <<< "$existing" > /dev/null; then
              echo "::error::A draft release exists for $RELEASE_TAG; a maintainer must resolve it before retrying."
              exit 1
            fi
            release_url="$(jq -r '.[0].html_url' <<< "$existing")"
            echo "Existing published release preserved: $release_url"
          else
            # Do not change Latest, including when publishing older maintenance
            # tags. Maintainers can choose that designation separately.
            flags=(--latest=false)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              flags+=(--prerelease)
            fi
            notes="Validated with toolchain $(go env GOVERSION) on Linux and macOS; production container checks run on Linux."
            notes+=$'\n\nPublic consumer verification (network and Docker required):\n```sh\n'
            notes+="go run ./tools/publiccheck -version $RELEASE_TAG -commit $CANDIDATE_COMMIT"
            notes+=$'\n```'
            release_url="$(gh release create "$RELEASE_TAG" --repo "$GH_REPO" \
              --verify-tag --generate-notes --title "$RELEASE_TAG" \
              --notes "$notes" "${flags[@]}")"
          fi
          printf 'Release: %s\n' "$release_url" >> "$GITHUB_STEP_SUMMARY"
