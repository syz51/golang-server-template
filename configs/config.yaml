server:
  host: "0.0.0.0"
  port: 8080
  max_body_bytes: 1048576
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 30s
  cors_allowed_origins: []

logger:
  level: "info"
  format: "json"

app:
  name: "golang-server-template"
  version: "1.0.0"
  environment: "development"
