root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
args_bin = []
entrypoint = ["./tmp/server"]
cmd = "go build -o ./tmp/server ./cmd/server"
delay = 1000
exclude_dir = ["assets", "tmp", "vendor", "testdata"]
exclude_file = []
exclude_regex = ["_test.go"]
exclude_unchanged = false
follow_symlink = false
include_dir = []
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "env"]
include_file = [".env"]
kill_delay = "5s"
log = "build-errors.log"
poll = false
poll_interval = 500
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = true
stop_on_error = true

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
silent = false
time = false

[misc]
clean_on_exit = false


[screen]
clear_on_rebuild = false
keep_scroll = true
